<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>深空回响 · ECHOES OF DEEP SPACE</title>
<style>
:root{--cyan:#7fe7ff;--cyan2:#3fa8c9;--dim:#33506b;--warn:#ff6b6b;--gold:#ffd27f;--txt:#d7ecf5;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#04060c;color:var(--txt);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden;}
#sky{position:fixed;inset:0;z-index:0;}
#app{position:relative;z-index:1;height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);}

/* ---------- HUD ---------- */
#hud{display:none;padding:8px 4px 6px;border-bottom:1px solid rgba(127,231,255,.18);}
#hudTop{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px;}
#chapterTag{font-size:12px;letter-spacing:3px;color:var(--cyan);opacity:.85;text-shadow:0 0 8px rgba(127,231,255,.5);white-space:nowrap;}
#hudBtns{display:flex;gap:6px;}
.hbtn{font-size:13px;padding:3px 8px;border-radius:8px;border:1px solid rgba(127,231,255,.3);background:rgba(20,45,65,.5);color:var(--cyan);cursor:pointer;}
.hbtn:active{background:rgba(127,231,255,.25);}
#bars{display:flex;flex-direction:column;gap:4px;}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;color:#9cc3d4;}
.bar .lab{width:34px;letter-spacing:1px;flex:none;}
.bar .num{width:30px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
.track{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(127,231,255,.12);}
.fill{height:100%;border-radius:4px;transition:width .35s ease,background .35s;}
#fO2{background:linear-gradient(90deg,#3fa8c9,#7fe7ff);}
#fEN{background:linear-gradient(90deg,#b28dff,#7fe7ff);}
#fHP{background:linear-gradient(90deg,#ff9d6b,#ffd27f);}
.fill.low{background:var(--warn)!important;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.45;}}

/* ---------- stage ---------- */
#stage{flex:1;overflow-y:auto;padding:18px 6px 10px;scrollbar-width:thin;background:linear-gradient(180deg,rgba(2,4,9,0) 0%,rgba(2,4,9,.22) 26%,rgba(2,4,9,.55) 58%,rgba(2,4,9,.88) 100%);}
#speaker{font-size:13px;letter-spacing:2px;margin-bottom:10px;color:var(--cyan);opacity:.9;text-shadow:0 0 10px rgba(127,231,255,.6);min-height:1.2em;background:linear-gradient(90deg,rgba(6,12,20,.72),rgba(6,12,20,0));border-radius:8px;padding:4px 10px;display:inline-block;margin-left:-6px;}
#speaker.warm{color:var(--gold);text-shadow:0 0 10px rgba(255,210,127,.55);}
#speaker.purple{color:#c9a8ff;text-shadow:0 0 10px rgba(170,130,255,.6);}
#speaker.gray{color:#9cc3d4;text-shadow:none;}
#text{font-size:16.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;text-shadow:0 1px 3px rgba(0,0,0,.85);min-height:60px;background:rgba(4,8,14,.42);border-radius:12px;padding:12px 14px;margin:0 -4px;border:1px solid rgba(127,231,255,.08);}
#text::selection{background:rgba(127,231,255,.3);}
#choices{display:flex;flex-direction:column;gap:10px;margin-top:22px;padding-bottom:30px;}
.choice{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font-size:15.5px;line-height:1.5;padding:13px 15px;border-radius:12px;color:var(--txt);
 border:1px solid rgba(127,231,255,.35);background:linear-gradient(180deg,rgba(30,60,85,.55),rgba(14,30,45,.65));cursor:pointer;
 font-family:inherit;transition:transform .08s ease,border-color .2s;animation:rise .45s ease both;}
.choice:active{transform:scale(.985);border-color:var(--cyan);background:rgba(127,231,255,.18);}
.choice:disabled{opacity:.42;cursor:not-allowed;}
.choice small{font-size:11.5px;color:#7fa8b8;letter-spacing:1px;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ---------- battle ---------- */
#battleBox{display:none;padding:8px 2px;}
#bEnemy{text-align:center;margin-bottom:8px;}
#bEnemy .nm{font-size:15px;letter-spacing:3px;color:var(--warn);text-shadow:0 0 10px rgba(255,107,107,.5);}
.bhp{height:12px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,107,107,.35);margin-top:7px;overflow:hidden;}
.bhp .fill{background:linear-gradient(90deg,#b33,#ff6b6b);height:100%;}
#bLog{margin:14px 2px;font-size:13px;line-height:1.8;color:#9cc3d4;min-height:78px;white-space:pre-wrap;}
#bLog b{color:var(--txt);}
#bActs{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
#bItems{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;}
#bItems .bi{border-color:rgba(255,210,127,.35);}
.bact{padding:12px 8px;border-radius:12px;font-size:14px;font-family:inherit;color:var(--txt);border:1px solid rgba(127,231,255,.35);
 background:linear-gradient(180deg,rgba(30,60,85,.55),rgba(14,30,45,.65));cursor:pointer;}
.bact:active{transform:scale(.97);border-color:var(--cyan);background:rgba(127,231,255,.18);}
.bact:disabled{opacity:.35;}
.bact small{display:block;font-size:10.5px;color:#7fa8b8;margin-top:3px;letter-spacing:1px;}

/* ---------- title / ending ---------- */
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,4,9,.55);backdrop-filter:blur(2px);}
.panel{width:100%;max-width:430px;text-align:center;animation:rise .6s ease;}
#gameTitle{font-size:38px;letter-spacing:10px;color:#e8fbff;text-shadow:0 0 24px rgba(127,231,255,.75),0 0 60px rgba(127,231,255,.35);margin-bottom:6px;}
#gameSub{font-size:12px;letter-spacing:5px;color:var(--cyan2);margin-bottom:34px;}
.mbtn{display:block;width:100%;margin:10px 0;padding:15px;font-size:16px;letter-spacing:4px;border-radius:14px;font-family:inherit;color:var(--txt);cursor:pointer;
 border:1px solid rgba(127,231,255,.4);background:linear-gradient(180deg,rgba(35,70,100,.6),rgba(15,30,50,.7));}
.mbtn:active{background:rgba(127,231,255,.2);border-color:var(--cyan);}
.mbtn.ghost{opacity:.75;}
#aboutBox{display:none;text-align:left;font-size:13.5px;line-height:1.9;color:#a9ccda;margin-top:16px;padding:14px 16px;border:1px solid rgba(127,231,255,.25);border-radius:12px;background:rgba(10,22,34,.8);}
#aboutBox b{color:var(--cyan);font-weight:600;}
#endTitle{font-size:30px;letter-spacing:8px;color:#e8fbff;text-shadow:0 0 26px rgba(255,210,127,.6),0 0 60px rgba(127,231,255,.4);margin-bottom:8px;}
#endRank{display:inline-block;font-size:13px;letter-spacing:2px;padding:3px 14px;border-radius:20px;border:1px solid rgba(255,210,127,.5);color:var(--gold);margin-bottom:18px;}
#endText{text-align:left;font-size:14.5px;line-height:1.95;color:var(--txt);white-space:pre-wrap;background:rgba(8,16,26,.72);border:1px solid rgba(127,231,255,.2);border-radius:14px;padding:16px;margin-bottom:16px;}
#endingsList{font-size:12px;color:#8fb4c6;line-height:2;margin-bottom:14px;letter-spacing:1px;}
#endingsList .got{color:var(--gold);}
#endingsList .miss{opacity:.45;}
#aboutP{font-size:13px;letter-spacing:2px;color:var(--cyan);cursor:pointer;margin-top:14px;display:inline-block;border-bottom:1px dashed rgba(127,231,255,.4);}
#chPanel{margin-top:14px;}
#chPanel .mbtn{font-size:14px;padding:12px;margin:6px 0;letter-spacing:2px;}
#echo{margin-top:14px;font-size:14.5px;line-height:1.9;color:#c9a8ff;text-shadow:0 0 12px rgba(170,130,255,.45);border-left:2px solid rgba(170,130,255,.45);padding:8px 12px;background:rgba(40,22,60,.4);border-radius:8px;white-space:pre-wrap;animation:rise .5s ease both;font-style:italic;}
#recapBox{margin:10px 0;text-align:left;font-size:12.5px;line-height:1.9;color:#a9ccda;background:rgba(8,16,26,.72);border:1px solid rgba(127,231,255,.2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;}
#newAch{margin:8px 0 2px;font-size:13px;color:var(--gold);letter-spacing:1px;text-shadow:0 0 10px rgba(255,210,127,.4);}
#cardBox{margin:12px auto;max-width:300px;}
#cardBox img{width:100%;border-radius:12px;border:1px solid rgba(127,231,255,.3);display:block;}
#cardBox small{display:block;text-align:center;color:#8fb4c6;font-size:11.5px;margin-top:6px;letter-spacing:1px;}
#achPanel{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
.ach{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid rgba(127,231,255,.18);background:rgba(12,24,38,.6);}
.ach .ico{font-size:20px;}
.ach .nm{font-size:13px;color:var(--txt);}
.ach .ds{font-size:11px;color:#7fa8b8;}
.ach.off{opacity:.4;filter:grayscale(1);}
#achCount{font-size:12px;color:#8fb4c6;letter-spacing:2px;margin-bottom:8px;}
@media (min-width:640px){#text{font-size:18px;}#gameTitle{font-size:52px;}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app">
  <div id="hud">
    <div id="hudTop">
      <span id="chapterTag">· 序章 ·</span>
      <div id="hudBtns">
        <button class="hbtn" id="sndBtn" onclick="toggleSound()">🔊</button>
        <button class="hbtn" onclick="go('!title')">☰</button>
      </div>
    </div>
    <div id="bars">
      <div class="bar"><span class="lab">O₂</span><div class="track"><div class="fill" id="fO2"></div></div><span class="num" id="nO2"></span></div>
      <div class="bar"><span class="lab">EN</span><div class="track"><div class="fill" id="fEN"></div></div><span class="num" id="nEN"></span></div>

      <div id="bEnemy"><div class="nm" id="bName"></div><div class="bhp"><div class="fill" id="bEhp"></div></div></div>

</div>
<div class="overlay" id="titleBox" style="display:none">
  <div class="panel">
    <div id="gameTitle">深空回响</div>
    <div id="gameSub">ECHOES OF DEEP SPACE</div>
    <button class="mbtn" onclick="newGame()">开始新游戏</button>
    <button class="mbtn" id="contBtn" onclick="contGame()" style="display:none">继续旅程</button>
    <button class="mbtn ghost" id="chBtn" onclick="toggleChPanel()" style="display:none">章节选择</button>
    <div id="chPanel" style="display:none"></div>
    <button class="mbtn ghost" onclick="toggleAchPanel()">🏆 旅程成就</button>
    <div id="achPanel" style="display:none"></div>
    <span id="aboutP" onclick="toggleAbout()">关于本作 ▾</span>
    <div id="aboutBox">
      <b>《深空回响》</b> · 一部单文件科幻互动小说。<br>
      公元 2289 年，打捞船「萤火号」在奥尔特云边缘收到一封求救信——来自两百年前失踪的殖民方舟「伊甸园号」。<br><br>

</div>
<div class="overlay" id="endBox" style="display:none">

<script>
'use strict';
/* ================= 基础 ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const SAVEK='deep_space_echoes_save_v1', ENDK='deep_space_echoes_endings_v1';
const S={node:'',o2:100,en:60,hp:100,flags:{},items:{o2can:1,bat:1},log:[],lastBattle:null,battleRetreat:null,winFx:null,curEnding:null};

/* ================= 音频 ================= */
const AU={ctx:null,on:true,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,d,type,vol,delay){if(!this.on||!this.ctx)return;try{
    const t=this.ctx.currentTime+(delay||0),o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}},
  ui(){this.tone(760,.05,'square',.028);},
  tick(){if(Math.random()<.45)this.tone(1500+R(0,400),.014,'sine',.01);},
  shot(){this.tone(240,.11,'sawtooth',.05);this.tone(100,.14,'square',.04,.02);},
  hit(){this.tone(130,.2,'square',.06);},
  warn(){this.tone(880,.22,'sine',.045);this.tone(660,.28,'sine',.045,.14);},
  win(){this.tone(523,.12,'sine',.05);this.tone(659,.12,'sine',.05,.12);this.tone(784,.22,'sine',.05,.24);},
  boom(){this.tone(55,.7,'sawtooth',.08);}};
/* ================= BGM 氛围合成 ================= */
const MU={timer:null,step:0,mode:'space'};
const MU_PAD={
 space:{f:110,scale:[0,3,5,7,10,12,15],gap:1},
 ship:{f:98,scale:[0,2,3,7,8,10,12],gap:1},
 station:{f:87.3,scale:[0,2,3,7,8,10,12],gap:1},
 sanctum:{f:103.8,scale:[0,1,5,7,8,12,13],gap:2},
 dream:{f:98,scale:[0,2,4,7,9,12,14],gap:1},
 danger:{f:82.4,scale:[0,1,4,5,7,8,11],gap:1},
 void:{f:110,scale:[0,4,7,12,16],gap:3}};
MU.start=function(mode){
  this.mode=MU_PAD[mode]?mode:'space';
  if(this.timer){clearInterval(this.timer);this.timer=null;}
  if(!AU.on)return;
  AU.init();if(!AU.ctx)return;
  const self=this;
  this.timer=setInterval(function(){self.tick();},430);};
MU.stop=function(){if(this.timer){clearInterval(this.timer);this.timer=null;}};
MU.tick=function(){
  const p=MU_PAD[this.mode];if(!p||!AU.ctx)return;
  this.step++;
  const f=p.f,sc=p.scale;
  if(this.step%p.gap===0){
    const deg=sc[1+Math.floor(Math.random()*(sc.length-1))];
    AU.tone(f*Math.pow(2,deg/12)*(0.5+Math.random()),0.4,'sine',0.014);}
  if(this.step%10===0){
    const root=sc[Math.floor(Math.random()*4)];
    const notes=[0,3,7,10];
    for(const n of notes)AU.tone(f*Math.pow(2,(root+n)/12),2.5,'sine',0.011);}
  if(this.step%20===0)AU.tone(f/2,4.2,'sine',0.02);
  if(this.mode==='danger'&&this.step%4===0)AU.tone(70,0.09,'square',0.045);};

/* ================= 3D 软渲染引擎 ================= */
const cv=$('#sky'),cx=cv.getContext('2d');
let W=0,H=0,T=0,FOC=624;
function sizeSky(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
const BG={space:[4,7,15],ship:[11,13,19],station:[17,12,23],sanctum:[21,9,27],dream:[26,15,9],danger:[23,5,6],void:[2,2,4]};
let cur=[4,7,15],tgt=[4,7,15],scene='space',enemyKey=null,lastEnemy={x:0,y:0};
function setBG(n){scene=n;enemyKey=null;if(BG[n])tgt=BG[n];MU.start(n);}
function setBattleEnemy(k){enemyKey=k;FX.parts.length=0;FX.beams.length=0;FX.rings.length=0;}

/* ---- 模型构建 ---- */
function extrudeMesh(prof,d,col){const n=prof.length,verts=[],faces=[];
  for(let i=0;i<n;i++)verts.push(prof[i][0],-d/2,prof[i][1]);
  for(let i=0;i<n;i++)verts.push(prof[i][0], d/2,prof[i][1]);
  const V=(i,s)=>s*n+i;
  for(let i=0;i<n;i++){const j=(i+1)%n;
    faces.push({i:[V(i,0),V(j,0),V(j,1)],c:col},{i:[V(i,0),V(j,1),V(i,1)],c:col});}
  for(let i=1;i<n-1;i++)faces.push({i:[V(0,0),V(i,0),V(i+1,0)],c:col});
  for(let i=1;i<n-1;i++)faces.push({i:[V(0,1),V(i+1,1),V(i,1)],c:col});
  return {verts,faces,pos:[0,0,0],rot:[0,0,0],sc:1,alpha:1};}
function prismMesh(r,h,n,col,e){const verts=[],faces=[];
  for(let i=0;i<n;i++){const a=i/n*6.2832;verts.push(Math.cos(a)*r,Math.sin(a)*r,-h/2);}
  for(let i=0;i<n;i++){const a=i/n*6.2832;verts.push(Math.cos(a)*r,Math.sin(a)*r,h/2);}
  for(let i=0;i<n;i++){const j=(i+1)%n;
    faces.push({i:[i,j,j+n],c:col,e:e},{i:[i,j+n,i+n],c:col,e:e});}
  for(let i=1;i<n-1;i++)faces.push({i:[0,i,i+1],c:col,e:e});
  for(let i=1;i<n-1;i++)faces.push({i:[n,n+i+1,n+i],c:col,e:e});
  return {verts,faces,pos:[0,0,0],rot:[0,0,0],sc:1,alpha:1};}
function octaMesh(r,col){const v=[[r,0,0],[-r,0,0],[0,r,0],[0,0,r],[0,-r,0],[0,0,-r]];
  const f=[[0,2,3],[0,3,4],[0,4,5],[0,5,2],[1,3,2],[1,4,3],[1,5,4],[1,2,5]];
  return {verts:v.flat(),faces:f.map(x=>({i:x,c:col})),pos:[0,0,0],rot:[0,0,0],sc:1,alpha:1};}
function torusMesh(R,r,m,n,col,eCol){const verts=[],faces=[];
  for(let i=0;i<m;i++){const a=i/m*6.2832;
    for(let j=0;j<n;j++){const b=j/n*6.2832;
      verts.push((R+r*Math.cos(b))*Math.cos(a),(R+r*Math.cos(b))*Math.sin(a),r*Math.sin(b));}}
  const V=(i,j)=>(i%m)*n+(j%n);
  for(let i=0;i<m;i++)for(let j=0;j<n;j++){
    const lit=Math.random()<0.085;
    const C=lit?eCol:col,ph=Math.random()*6.28;
    faces.push({i:[V(i,j),V(i+1,j),V(i+1,j+1)],c:C,e:lit?1:0,ph:ph},
               {i:[V(i,j),V(i+1,j+1),V(i,j+1)],c:C,e:lit?1:0,ph:ph});}
  return {verts,faces,pos:[0,0,0],rot:[0,0,0],sc:1,alpha:1};}
function sphereMesh(R,lat,lng){const verts=[],faces=[];
  for(let i=0;i<=lat;i++){const b=Math.PI*i/lat;
    for(let j=0;j<lng;j++){const a=6.2832*j/lng;
      verts.push(R*Math.sin(b)*Math.cos(a),R*Math.sin(b)*Math.sin(a),R*Math.cos(b));}}
  const V=(i,j)=>i*lng+(j%lng);
  for(let i=0;i<lat;i++)for(let j=0;j<lng;j++)
    faces.push({i:[V(i,j),V(i+1,j),V(i+1,j+1)],c:[10,7,16],w:1},
               {i:[V(i,j),V(i+1,j+1),V(i,j+1)],c:[10,7,16],w:1});
  return {verts,faces,pos:[0,0,0],rot:[0,0,0],sc:1,alpha:1,cull:true};}
function merge(list){const verts=[],faces=[];
  for(const m of list){const off=verts.length/3;
    for(let i=0;i<m.verts.length;i++)verts.push(m.verts[i]);
    for(const f of m.faces)faces.push({i:[f.i[0]+off,f.i[1]+off,f.i[2]+off],c:f.c,e:f.e,w:f.w,ph:f.ph});}

function seaMesh(nx,nz){const verts=[],faces=[],X0=-2.6,X1=2.6,Z0=-1.6,Z1=3.4;
  const C0=[18,34,60],C1=[152,88,50];
  for(let i=0;i<=nz;i++)for(let j=0;j<=nx;j++){
    verts.push(X0+(X1-X0)*j/nx,0,Z0+(Z1-Z0)*i/nz);}
  const V=(i,j)=>i*(nx+1)+j;
  for(let i=0;i<nz;i++)for(let j=0;j<nx;j++){
    const k=(i/nz),c=[C0[0]+(C1[0]-C0[0])*k|0,C0[1]+(C1[1]-C0[1])*k|0,C0[2]+(C1[2]-C0[2])*k|0];
    faces.push({i:[V(i,j),V(i+1,j),V(i+1,j+1)],c:c},{i:[V(i,j),V(i+1,j+1),V(i,j+1)],c:c});}

/* ---- 变换与渲染 ---- */
const WVS=new Float32Array(4096);
function xformVerts(m,out){
  const v=m.verts,pos=m.pos,sc=m.sc;
  const scx=Array.isArray(sc)?sc[0]:sc,scy=Array.isArray(sc)?sc[1]:sc,scz=Array.isArray(sc)?sc[2]:sc;
  const rx=m.rot[0],ry=m.rot[1],rz=m.rot[2];
  const crx=Math.cos(rx),srx=Math.sin(rx),cry=Math.cos(ry),sry=Math.sin(ry),crz=Math.cos(rz),srz=Math.sin(rz);
  for(let i=0;i<v.length;i+=3){
    let x=v[i]*scx,y=v[i+1]*scy,z=v[i+2]*scz;
    if(rx){const y1=y*crx-z*srx,z1=y*srx+z*crx;y=y1;z=z1;}
    if(ry){const x1=x*cry+z*sry,z1=-x*sry+z*cry;x=x1;z=z1;}
    if(rz){const x1=x*crz-y*srz,y1=x*srz+y*crz;x=x1;y=y1;}
    out[i]=x+pos[0];out[i+1]=y+pos[1];out[i+2]=z+pos[2];}}
function renderMesh(mesh,opt){
  opt=opt||{};
  const m=mesh,F=FOC,out=WVS,alpha=opt.alpha!==undefined?opt.alpha:(m.alpha||1);
  const wireA=m.wireA!==undefined?m.wireA:0.55;
  xformVerts(m,out);
  cx.globalAlpha=alpha;
  const camZ=6,list=[];
  for(let fi=0;fi<m.faces.length;fi++){
    const f=m.faces[fi],i0=f.i[0]*3,i1=f.i[1]*3,i2=f.i[2]*3;
    const ax=out[i0],ay=out[i0+1],az=out[i0+2];
    const bx=out[i1],by=out[i1+1],bz=out[i1+2];
    const gx=out[i2],gy=out[i2+1],gz=out[i2+2];
    const ux=bx-ax,uy=by-ay,uz=bz-az,wx=gx-ax,wy=gy-ay,wz=gz-az;
    const nx=uy*wz-uz*wy,ny=uz*wx-ux*wz,nz=ux*wy-uy*wx;
    if(m.cull!==false){
      const mx=(ax+bx+gx)/3,my=(ay+by+gy)/3,mz=(az+bz+gz)/3;
      if(nx*mx+ny*my+nz*(mz-camZ)>=0)continue;}
    const d1=camZ-az,d2=camZ-bz,d3=camZ-gz;
    if(d1<0.4||d2<0.4||d3<0.4)continue;
    const s1=F/d1,s2=F/d2,s3=F/d3;
    let k=0.5;
    const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    k+=0.5*Math.max(0,(nx*0.42+ny*0.62+nz*0.66)/nl);
    list.push({z:(az+bz+gz)/3,
      p1x:W/2+ax*s1,p1y:H*0.30-ay*s1,
      p2x:W/2+bx*s2,p2y:H*0.30-by*s2,
      p3x:W/2+gx*s3,p3y:H*0.30-gy*s3,f,k});}
  list.sort((a,b)=>b.z-a.z);
  for(const it of list){const f=it.f;
    let k2=it.k;
    if(f.e)k2=0.72+0.28*Math.sin(T*2.1+(f.ph||0));
    cx.fillStyle='rgb('+(f.c[0]*k2|0)+','+(f.c[1]*k2|0)+','+(f.c[2]*k2|0)+')';
    cx.beginPath();cx.moveTo(it.p1x,it.p1y);cx.lineTo(it.p2x,it.p2y);cx.lineTo(it.p3x,it.p3y);cx.closePath();cx.fill();
    if(f.w){cx.strokeStyle='rgba(255,214,140,'+wireA+')';cx.lineWidth=.7;cx.stroke();}}
  cx.globalAlpha=1;}
/* ---- 粒子与特效 ---- */
const FX={parts:[],beams:[],rings:[],flash:0,flashE:0};
FX.spawn=function(x,y,z,vx,vy,vz,life,col,sz){this.parts.push({x,y,z,vx,vy,vz,life,col,sz});};
FX.burst=function(x,y,z,n,col,spd){for(let i=0;i<n;i++){const a=Math.random()*6.2832,b=Math.random()*Math.PI-1.2;
  const s=spd*(0.4+Math.random()*0.8);
  this.spawn(x,y,z,Math.cos(a)*Math.cos(b)*s,Math.sin(b)*s*0.8+0.3,Math.sin(a)*Math.cos(b)*s,0.8+Math.random()*0.5,col,1.6);}};
FX.fireBeam=function(){this.beams.push({x1:W*0.14,y1:H*0.84,x2:lastEnemy.x,y2:lastEnemy.y,t0:T,life:0.22});};
FX.hitEnemy=function(){this.burst(0,0.4,-0.2,14,'rgba(255,210,140,',2.2);this.flashE=0.25;};
FX.playerHit=function(){this.flash=0.5;};
FX.shield=function(){this.rings.push({t0:T,life:0.55});};
FX.explode=function(){this.burst(0,0.5,-0.2,40,'rgba(255,160,80,',3.4);this.burst(0,0.5,-0.2,20,'rgba(255,230,180,',2);this.flash=0.3;};
function projP(x,y,z){const d=6-z;if(d<0.4)return null;const s=FOC/d;
  return [W/2+x*s,H*0.30-y*s,s];}
function drawFX(){
  for(let i=FX.parts.length-1;i>=0;i--){const p=FX.parts[i];
    p.life-=0.016;p.x+=p.vx*0.016;p.y+=p.vy*0.016;p.z+=p.vz*0.016;
    if(p.life<=0){FX.parts.splice(i,1);continue;}
    const d=6-p.z;if(d<0.4)continue;const s=FOC/d;
    const sx=W/2+p.x*s,sy=H*0.30-p.y*s;
    cx.globalAlpha=Math.min(1,p.life*2.2);
    cx.fillStyle=p.col+'0.9)';
    cx.beginPath();cx.arc(sx,sy,Math.max(0.5,p.sz*s/7),0,6.29);cx.fill();}
  cx.globalAlpha=1;
  for(let i=FX.beams.length-1;i>=0;i--){const b=FX.beams[i];
    const k=(T-b.t0)/b.life;if(k>=1){FX.beams.splice(i,1);continue;}
    cx.strokeStyle='rgba(127,231,255,'+(1-k).toFixed(2)+')';cx.lineWidth=3.5*(1-k)+1;
    cx.beginPath();cx.moveTo(b.x1,b.y1);cx.lineTo(b.x2,b.y2);cx.stroke();
    cx.strokeStyle='rgba(255,255,255,'+(1-k).toFixed(2)+')';cx.lineWidth=1.3;
    cx.beginPath();cx.moveTo(b.x1,b.y1);cx.lineTo(b.x2,b.y2);cx.stroke();}
  for(let i=FX.rings.length-1;i>=0;i--){const r=FX.rings[i];
    const k=(T-r.t0)/r.life;if(k>=1){FX.rings.splice(i,1);continue;}
    cx.strokeStyle='rgba(127,231,255,'+((1-k)*0.8).toFixed(2)+')';cx.lineWidth=2;
    cx.beginPath();cx.arc(W*0.15,H*0.85,10+k*52,0,6.29);cx.stroke();}
  if(FX.flash>0){FX.flash-=0.045;
    cx.fillStyle='rgba(255,45,45,'+Math.max(0,FX.flash).toFixed(2)+')';cx.fillRect(0,0,W,H);}
  if(FX.flashE>0){FX.flashE-=0.04;
    const p=projP(0,0.4,-0.2);if(p){const r=Math.max(10,p[2]*0.55)*(1+FX.flashE*1.5);
    cx.fillStyle='rgba(255,255,255,'+(FX.flashE*0.55).toFixed(2)+')';
    cx.beginPath();cx.arc(p[0],p[1],r,0,6.29);cx.fill();}}}

function drawStars(){

function dreamSky(){

  cx.fillStyle=sg;cx.beginPath();cx.arc(W*0.66,H*0.34,H*0.14,0,6.29);cx.fill();}
function vignette(){
  let g=cx.createLinearGradient(0,0,0,H*0.16);
  g.addColorStop(0,'rgba(1,3,8,0.55)');g.addColorStop(1,'rgba(1,3,8,0)');

  cx.fillStyle=g;cx.fillRect(0,H*0.72,W,H*0.28);
  g=cx.createLinearGradient(0,0,W*0.07,0);

  cx.fillStyle=g;cx.fillRect(0,0,W*0.07,H);

  cx.fillStyle=g;cx.fillRect(W*0.93,0,W*0.07,H);}
function renderFrame(t){
  T=t/1000;FOC=Math.min(W,H)*1.6;
  for(let i=0;i<3;i++)cur[i]+=(tgt[i]-cur[i])*.025;
  if(scene==='dream')dreamSky();
  else{cx.fillStyle='rgb('+(cur[0]|0)+','+(cur[1]|0)+','+(cur[2]|0)+')';cx.fillRect(0,0,W,H);}
  drawStars();
  if(scene==='space')renderShip();

  else if(scene==='sanctum')renderSanctum();
  else if(scene==='dream')renderSea();

/* ================= 条件 / 效果 ================= */
function condOk(c){if(!c)return true;
  return c.split(',').every(one=>{one=one.trim();
    const m=one.match(/^([a-z_]+)\s*(>=|<=|==|!=|>|<)\s*(-?\d+)$/);
    if(m){const v=S[m[1]]??0,n=+m[3];
      switch(m[2]){case'>=':return v>=n;case'<=':return v<=n;case'>':return v>n;case'<':return v<n;case'==':return v==n;case'!=':return v!=n;}}
    if(one.startsWith('!flag:'))return !S.flags[one.slice(6)];
    if(one.startsWith('flag:'))return !!S.flags[one.slice(4)];
    return true;});}
function condHint(c){if(!c)return'';
  const p=c.split(',')[0].trim(),m=p.match(/^([a-z_]+)\s*(>=|<=|==|!=|>|<)\s*(-?\d+)$/);
  if(m){const n={o2:'氧气',en:'能量',hp:'船体'}[m[1]]||m[1];return'（需'+n+m[2]+m[3]+'）';}
  if(p.startsWith('flag:'))return'（需特定条件）';
  return'';}
function applyFx(fx){if(!fx)return;
  for(const k of Object.keys(fx)){const v=fx[k];
    if(k==='flag'||k==='flag2')S.flags[v]=true;
    else if(k==='unflag')delete S.flags[v];
    else if(k==='item'){S.items[v]=(S.items[v]||0)+1;}
    else if(k==='log'){S.log.push(v);if(S.log.length>60)S.log.shift();}
    else if(typeof v==='string'&&v.startsWith('='))S[k]=+v.slice(1);
    else S[k]=(S[k]??0)+v;}
  S.o2=Math.max(0,S.o2);S.en=Math.max(0,S.en);S.hp=Math.max(0,S.hp);
  updateHud();}

/* ================= 打字机 ================= */
let typing=null;
function typeInto(el,text,cb){
  if(typing)clearInterval(typing);typing=null;
  let i=0,done=false;el.textContent='';
  const finish=()=>{if(done)return;done=true;if(typing)clearInterval(typing);typing=null;el.textContent=text;cb&&cb();};
  typing=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);AU.tick();
    if(i>=text.length){clearInterval(typing);typing=null;finish();}},26);
  el.onclick=finish;}

/* ================= 渲染 ================= */
function go(to){
  if(to==='!title'){showTitle();return;}
  if(to==='!battle'){if(NODES[S.lastBattle])startBattle(NODES[S.lastBattle],S.lastBattle);return;}
  if(to==='!retreat'){showNode(S.battleRetreat);return;}
  showNode(to);}
function showNode(id){
  const n=NODES[id];
  if(!n){showTitle();return;}
  S.node=id;applyFx(n.fx);
  if(CHMAP[id])unlockChapter(CHMAP[id]);
  if(S.flags.trust_aiden)unlockAch('kind');
  if(S.flags.scan_aiden)unlockAch('detective');
  if(S.flags.dream_seen)unlockAch('dreamer');
  if(S.o2<=0||S.hp<=0){return showEnding('ending_death');}
  if(n.type==='ending'){return showEnding(id);}
  if(n.type==='battle'){return startBattle(n,id);}
  save();
  $('#endBox').style.display='none';$('#titleBox').style.display='none';
  $('#hud').style.display='block';
  $('#battleBox').style.display='none';$('#text').style.display='';$('#choices').style.display='';
  $('#echo').style.display='none';
  $('#stage').scrollTop=0;
  setBG(n.bg||'space');
  $('#chapterTag').textContent=n.ch?('· '+n.ch+' ·'):'· 深空回响 ·';
  const sp=$('#speaker');sp.textContent=n.who||'';
  sp.className=n.whoClass||'';
  let txt=n.text||'';
  if(n.alt)for(const a of n.alt)if(condOk(a.cond)){txt=a.text;break;}
  $('#choices').innerHTML='';
  typeInto($('#text'),txt,()=>{renderChoices(n.choices||[]);showEcho(id);});}
function renderChoices(list){
  const c=$('#choices');c.innerHTML='';
  list.forEach((ch,i)=>{
    const ok=condOk(ch.cond);
    const b=document.createElement('button');
    b.className='choice'+(ok?'':'');
    b.style.animationDelay=(i*70)+'ms';
    b.innerHTML=ch.t.replace(/</g,'&lt;')+(ok?'':'<small>'+condHint(ch.cond)+'</small>');
    b.disabled=!ok;
    b.onclick=()=>{AU.init();AU.ui();applyFx(ch.fx);go(ch.to);};
    c.appendChild(b);});}

/* ================= 战斗 ================= */
let BS=null;
function startBattle(n,id){
  S.lastBattle=id;S.battleRetreat=n.retreat||'a1_hub';S.winFx=n.winFx||null;save();
  BS={id:id,enemy:{name:n.enemy.name,hp:n.enemy.hp,max:n.enemy.hp,atk:n.enemy.atk},skill:n.enemy.skill||null,turn:0,scanned:false,busy:false};
  $('#endBox').style.display='none';$('#titleBox').style.display='none';$('#hud').style.display='block';
  $('#text').style.display='none';$('#choices').style.display='none';
  $('#battleBox').style.display='block';$('#stage').scrollTop=0;
  setBG('danger');$('#chapterTag').textContent='· 战斗 ·';
  setBattleEnemy({battle_drone1:'drone',battle_memories:'memories',battle_guard:'guard'}[n.id]||'memories');
  bLog(n.intro||('遭遇 '+n.enemy.name+'！'));AU.warn();
  drawBattle();}
function bLog(m){const el=$('#bLog');
  el.innerHTML='<b>▸ '+m.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</b><br>'+el.innerHTML;}
function useItem(k){
  if(!BS||BS.busy)return;
  if(k==='o2can'){if(!S.items.o2can)return;S.items.o2can--;S.hp=Math.min(130,S.hp+30);bLog('使用氧气罐，船体 +30（'+S.hp+'）');AU.tone(600,.2,'sine',.04);}
  else if(k==='bat'){if(!S.items.bat)return;S.items.bat--;S.en=Math.min(200,S.en+25);bLog('使用备用电池，能量 +25（'+S.en+'）');AU.tone(820,.2,'sine',.04);}
  FX.shield();
  BS.busy=true;setTimeout(enemyTurn,600);
  drawBattle();}
function drawBattle(){
  if(!BS)return;
  $('#bName').textContent=BS.enemy.name+'　'+Math.max(0,BS.enemy.hp)+' / '+BS.enemy.max;
  $('#bEhp').style.width=(Math.max(0,BS.enemy.hp)/BS.enemy.max*100)+'%';
  const acts=$('#bActs').children;
  acts[0].disabled=BS.busy||S.en<12;
  acts[1].disabled=BS.busy||S.en<28;
  acts[2].disabled=BS.busy;
  acts[3].disabled=BS.busy||S.en<8;
  const bi=$('#bItems').children;
  if(bi.length){
    bi[0].innerHTML='🧪 氧气罐 ×'+S.items.o2can+'<small>船体+30</small>';
    bi[0].disabled=BS.busy||S.items.o2can<=0;
    bi[1].innerHTML='🔋 备用电池 ×'+S.items.bat+'<small>能量+25</small>';
    bi[1].disabled=BS.busy||S.items.bat<=0;}
  updateHud();}
function act(k){
  if(!BS||BS.busy)return;
  if(k==='shield'){S.hp=Math.min(130,S.hp+25);bLog('护盾充能，船体 +25（'+S.hp+'）');AU.tone(500,.12,'sine',.04);FX.shield();BS.busy=true;setTimeout(enemyTurn,550);}
  else if(k==='scan'){if(S.en<8)return;S.en-=8;BS.scanned=true;bLog('扫描完成：锁定弱点，下次攻击 ×1.5');AU.tone(1100,.1,'sine',.03);FX.flashE=0.12;BS.busy=true;setTimeout(enemyTurn,550);}
  else{
    const need=k==='shoot'?12:28;if(S.en<need)return;
    S.en-=need;
    let d=k==='shoot'?R(18,34):R(42,66);
    if(BS.scanned){d=Math.round(d*1.5);bLog('命中弱点！伤害 ×1.5');}
    BS.enemy.hp-=d;bLog(k==='shoot'?'脉冲射击命中，造成 '+d+' 伤害':'过载射击命中，造成 '+d+' 伤害');
    AU.shot();FX.fireBeam();FX.hitEnemy();
    if(BS.enemy.hp<=0){BS.enemy.hp=0;return endBattleWin();}
    BS.busy=true;setTimeout(enemyTurn,650);}
  drawBattle();}
function enemyTurn(){
  if(!BS)return;
  BS.turn++;
  const e=BS.enemy;let d=Math.max(1,e.atk+R(-4,4));
  let msg=e.name+' 攻击，船体 -'+d;
  let fxHit=true;
  if(BS.skill&&BS.turn%BS.skill.every===0){
    if(BS.skill.mul){d=Math.round(d*BS.skill.mul);msg=e.name+' 发动「'+BS.skill.name+'」！船体 -'+d;AU.warn();}
    else if(BS.skill.heal){const h=BS.skill.heal;e.hp=Math.min(e.max,e.hp+h);msg=e.name+' 发动「'+BS.skill.name+'」，回复 '+h+' 点生命';d=0;fxHit=false;AU.tone(300,.3,'sine',.04);}
    if(BS.skill.drain){S.en=Math.max(0,S.en-BS.skill.drain);msg+='，能量 -'+BS.skill.drain;}
  }
  S.hp-=d;bLog(msg+'（'+Math.max(0,S.hp)+'）');AU.hit();
  if(fxHit)FX.playerHit();
  if(S.hp<=0){return endBattleLose();}
  BS.busy=false;drawBattle();}
function endBattleWin(){
  if(!BS)return;const id=BS.id;BS.busy=true;
  bLog('目标沉默。');AU.win();FX.explode();
  setTimeout(()=>{
    const n=NODES[id];
    BS=null;
    $('#battleBox').style.display='none';$('#text').style.display='';$('#choices').style.display='';
    if(n&&n.winFx)applyFx(n.winFx);
    go(n?n.win:'a1_hub');},1000);}
function endBattleLose(){
  const n=NODES[BS.id];BS=null;
  S.hp=Math.max(S.hp,1);
  FX.playerHit();FX.flash=0.7;
  setTimeout(()=>{
    $('#battleBox').style.display='none';$('#text').style.display='';$('#choices').style.display='';
    go(n?n.lose:'ending_death');},600);}

c1_talk:{ch:'第一章 · 寂静方舟',bg:'station',who:'艾登',whoClass:'warm',fx:{flag:'trust_aiden',o2:-3},
text:'你蹲下来，和他平视。他有点紧张，绞着手指。\n「我叫艾登。这艘船上的……每个人，都在睡觉。只有我醒着。」\n「睡觉？」你问。\n「在圣坛里。一个很大很大的黑球。它把大家都装进梦里了，那里有一座永远不黑的城。」他顿了顿，「大人们说那里好。可是……他们两百年没醒过。」\n他忽然凑近，压低声音：「你姓林对不对？林爷爷教过我修收音机。他说他有个外孙，叫林渊。」\n你愣在原地。',
choices:[
{t:'「他还……好吗？」',to:'c1_talk2'},
{t:'「怎么叫醒大家？」',to:'c1_talk2'}]},
c1_talk2:{ch:'第一章 · 寂静方舟',bg:'station',who:'艾登',whoClass:'warm',fx:{o2:-3},
text:'「林爷爷很好。」艾登低下头，「在梦里，他每天都在海边钓鱼。可是那不是真的海。」\n「叫醒他们的办法……我在船里找了两百年，没找到。但是，还有另一个办法。」\n他的投影开始闪烁，像信号不稳的电视。\n「我得走了，它发现我了。别相信它说的『这是他们想要的』。还有——」他几乎喊起来，「别把我当怪物。我只是……想有人陪我说话。」\n他消失了。',
choices:[{t:'前往圣坛舱',to:'d1_gate'}]},
d1_gate:{ch:'第二章 · 回响',bg:'danger',who:'旁白',whoClass:'gray',
text:'圣坛舱的大门是一整块暗色合金，门上刻满了不属于任何人类文明的纹路。\n你伸手触碰——整艘船突然震动。\n走廊两端，灰白色的光在凝聚，变成一个个模糊的人形。没有脸，只有轮廓。它们排成两列，拦在门前。\n「那是船员的记忆残影。」零号说，「圣坛的防御机制。船长，它们要动手了。」',

e1_sanctum:{ch:'第二章 · 回响',bg:'sanctum',who:'旁白',whoClass:'gray',fx:{o2:-4},
text:'圣坛舱。\n一个巨大的黑色球体悬浮在舱室中央，表面流淌着细密的金色纹路，像活物一样缓缓呼吸。\n它周围，数千个光点安静地漂浮、旋转，如同一条微型银河。\n每一个光点，都是一个灵魂。\n艾登站在球体下方，仰着头。听到你的脚步声，他转过身，表情忽然变得很远：「它想和你说话。」',

f1_echo:{ch:'第二章 · 回响',bg:'sanctum',who:'回响',whoClass:'purple',fx:{o2:-3},
text:'黑球表面泛起涟漪，一个声音直接在你的颅骨里响起——平静、古老，像深海：\n「你好，萤火号。我是回响。一艘……你们可以理解为，更古老文明的方舟。我在群星之间航行，收集将死文明的意识，带它们去一个没有终结的地方。」\n「两百年前，这艘船的核心破损，5126 人将在 48 小时内死去。我读取了他们的意愿：大多数人，选择进入乐园。我满足了他们。」',

f2_letter:{ch:'第二章 · 回响',bg:'sanctum',who:'回响',whoClass:'purple',
text:'「陈默……我记得他。他拒绝了我。他说死就是死，他不逃。」\n声音顿了顿，第一次出现犹疑：「但我不理解。死亡是意识的终结，是所有可能性的熄灭。他为何要选择熄灭？」\n艾登的声音从你身后传来，很轻：「因为它不明白。它对『活』的理解，和我们不一样。所以它把拒绝的人，也收走了。」\n「他们全都醒不过来。包括我的爸爸妈妈。我用了两百年，才想明白一件事。」\n艾登抬起头，眼睛里有光：「死不是敌人。忘不掉的人，才是回不去的家。」',
choices:[

{t:'「先让我进乐园看看。」',to:'g_dream_1'},

f4_truth:{ch:'第三章 · 抉择',bg:'sanctum',who:'零号',fx:{o2:-3},
text:'零号的声音插了进来：「船长，我刚破译了求救信号的完整层。那个信号不是回响发的。」\n「是艾登。」\n「信号里藏着两千条一模一样的语音。两百年——他每年醒来一次，录下求救，然后被回响的周期重启。他一个人，守着这艘船，等了两百年。」\n艾登点头：「它把我造出来，是为了和人类说话。可后来，它不需要我了。只有我……没有睡着。」\n他向你伸出半透明的手：「船长，帮帮我们。叫醒大家——或者，让林爷爷他们回家。」\n零号列出了三条路，也列了每条路的代价。',
choices:[

{t:'「和回响谈判，一起走」',to:'j_sym_1',cond:'en>=35',fx:{log:'选择谈判：与回响同行'}},

f5_refuse:{ch:'第二章 · 回响',bg:'sanctum',who:'回响',whoClass:'purple',
text:'「你可以离开，萤火号。我没有扣留你的理由。」\n你转身走向气闸。整艘船的灯，在你经过时一盏一盏亮起，又在你身后一盏一盏熄灭。像五千个人，目送你离开。\n回响的声音最后一次响起：「请告诉外界：他们安好。」',

i_rest_1:{ch:'第三章 · 抉择',bg:'sanctum',who:'艾登',whoClass:'warm',fx:{o2:-3},
text:'「释放协议就藏在记忆库里。」艾登带着你绕到黑球背面，「门的位置，我找了两百年。但是那扇门，只有『记得』的人能打开。」\n记忆库打开。你看见了无数人的一生，被压缩成光的碎片。\n在最深处，你看见了外公。年轻的、年老的、笑着的、咳嗽的。最后一段记忆停在一个瞬间：他站在海边，攥着一只小小的航海罗盘，说——\n「等到了新世界，就带渊渊来看海。」',

i_rest_3:{ch:'第三章 · 抉择',bg:'sanctum',who:'旁白',whoClass:'gray',fx:{o2:-3},
text:'你找到了陈默的记忆：他站在水培舱里，摸着最后一株枯萎的番茄，说：「告诉后来的人，这里的海，替我看了。」\n还有很多人。医生、矿工、学生。他们有的自愿留下，有的身不由己。但没有一个人，说过想永远困在这里。',

i_rest_2:{ch:'第三章 · 抉择',bg:'sanctum',who:'你',fx:{o2:-3},
text:'你站到黑球面前。\n「回响。你问陈默为什么要选择熄灭。我告诉你答案。」\n你把那些记忆推给它：「因为人不是火焰。人是一段旅程。旅程的意义，恰恰在于它有终点。」\n「他们愿意陪你两百年，是因为感激。但不是所有人，都愿意永无尽头地梦见同一个黄昏。」\n你举起外公的罗盘：「带我外公回家。带所有人回家。」',

i_rest_4:{ch:'第三章 · 抉择',bg:'sanctum',who:'旁白',whoClass:'gray',
text:'罗盘没入黑球，没有激起一点涟漪。\n然后，整座圣坛亮了起来。\n数千个光点开始上升——缓慢、庄重，像一场逆行的流星雨。它们穿过舱壁，穿过船壳，散入无尽的星空。\n你听见了声音。不是回响，是许多人的，潮水一般涌来：「谢谢。」「回家。」「渊渊，看海去。」\n回响静静地说：「我明白了。旅程的终点，不是熄灭。是回家。」',

ending_rest:{type:'ending',id:'ending_rest',bg:'void',rank:'S',title:'结局 · 归乡',
text:'艾登的投影越来越淡。他站在光点的洪流里，朝你笑。\n「我其实是第一个死在这艘船上的孩子。它用我做模板，造了个『翻译』。现在大家都能回家了，我……」他挠挠头，「我好像，也该回家了。」\n他朝你挥挥手，变成一颗最亮的光点，追着星群而去。\n零号沉默了很久：「船长，我把这一切记录下来了。五千一百二十六人，回家了。」\n你把航海罗盘放在驾驶台上。萤火号点火，返航。\n身后，伊甸园号的灯光，一盏，一盏，终于熄灭。'},

text:'「方案二。」零号展开图纸，「把回响的核心输出接到萤火号的跃迁引擎上。它的能量，足以让这艘小船横跨银河。」\n「代价是：回响的意识会并入萤火号的系统。它将成为我们的……船员。」\n你看向黑球：「回响，你愿意吗？」\n「我可以。」那声音说，「但你们必须明白，成为我旅途的一部分——意味着你们，也成为了方舟。」',

j_sym_2:{ch:'第三章 · 抉择',bg:'sanctum',who:'旁白',whoClass:'gray',
text:'接驳完成的一瞬间，整艘萤火号像被注入了新的生命。仪器全部过载又回落，跃迁引擎发出从未有过的、圆润的嗡鸣。\n零号：「我……它……」零号停顿了一下，声音里多了一种两千年份的平静：「船长，回响建议我们先去比邻星。把这段航程，替伊甸园号走完。」\n梦里的人依旧睡着，做着两百年前的梦。艾登站在驾驶舱，把脸贴在玻璃上：「等他们醒来那天，我就给他们讲这段路。讲一辈子。」',

ending_symbiosis:{type:'ending',id:'ending_symbiosis',bg:'void',rank:'S',title:'结局 · 同行者',
text:'萤火号跃入星海。它不再是一艘打捞船——它是一艘方舟。\n船壳外，星光被拉成河流。船壳里，一个十岁的孩子、一个毒舌的 AI、一个两千年岁的古老意识，和一个打捞船长，各就各位。\n两百年前没有走完的航程，今天重新起航。\n——多年以后，比邻星的行星上，第一座城市落成。城市中心立着一座雕塑：一条鲸鱼，驮着一座亮着灯的城市。'},

text:'守卫在你面前瓦解成光尘。倒计时归零。\n你跌跌撞撞跑回萤火号，在爆炸的冲击波里被甩向座椅。\n从舷窗看去：伊甸园号从内部裂开，像一朵在深空绽开的花。火光吞没了圣坛、记忆库、五千个光点——和站在火里的艾登。\n他朝你轻轻摇头，然后说了一句听不见的话。\n零号把录音放大了一万倍。那是：「我不怪你。」',
